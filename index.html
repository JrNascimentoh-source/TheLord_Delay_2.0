<style>

.screens{display:grid;grid-template-columns:1fr 1fr;gap:clamp(10px,1.4vw,26px);margin-bottom:clamp(10px,1.4vw,26px);flex:1;min-height:0}.screen{display:flex;flex-direction:column;min-width:0;padding:clamp(8px,1vw,20px);border:1px solid var(--red);border-radius:var(--r-lg);background:var(--panel);box-shadow:0 0 16px rgba(255,30,40,.3),inset 0 0 20px rgba(150,10,20,.18)}.screen.selected{border-color:var(--gold);box-shadow:0 0 18px rgba(232,179,78,.35)}

.cta-wrap{position:relative;display:flex;justify-content:center;margin-bottom:12px}.cta-wrap:before,.cta-wrap:after{content:"";position:absolute;top:50%;width:22%;height:2px;background:linear-gradient(90deg,transparent,var(--red));box-shadow:0 0 10px var(--red-glow)}.cta-wrap:before{left:6%}.cta-wrap:after{right:6%;transform:scaleX(-1)}.cta{position:relative;z-index:1;display:flex;align-items:center;gap:14px;padding:clamp(10px,1.3vw,22px) clamp(28px,5vw,100px);border-radius:40px;font-size:clamp(16px,1.8vw,32px);font-weight:800;letter-spacing:.03em;color:#2a1600;background:linear-gradient(#ffe09a,var(--gold) 45%,var(--gold-lo));border:1px solid var(--gold-hi);box-shadow:0 0 20px rgba(255,190,80,.5),inset 0 2px 0 rgba(255,255,255,.5);transition:transform .12s}.cta:active{transform:scale(.97)}.cta.on{background:linear-gradient(#ff5b5b,var(--red) 50%,#7c0a10);color:#fff;border-color:#ff8a8a;box-shadow:0 0 22px var(--red-glow)}
.footer{display:flex;justify-content:space-between;padding:12px 16px;border:1px solid var(--red-dim);border-radius:var(--r-md);font-size:clamp(11px,1vw,18px);color:var(--gold-text)}
.menu-panel{position:absolute;top:calc(clamp(6px,.8vw,14px) + 64px);left:clamp(18px,2vw,40px);z-index:50;width:min(330px,calc(100vw - 36px));padding:10px;border:1px solid var(--gold-lo);border-radius:var(--r-md);background:linear-gradient(160deg,#111019,#08080d);box-shadow:0 14px 35px rgba(0,0,0,.65),0 0 18px var(--red-glow);display:none}.menu-panel.open{display:block}.menu-title{padding:10px 12px 8px;color:var(--gold-hi);font-weight:800;letter-spacing:.05em;border-bottom:1px solid var(--red-dim);margin-bottom:6px}.menu-item{width:100%;display:flex;align-items:center;gap:12px;padding:13px 12px;border-radius:var(--r-sm);color:var(--txt);text-align:left}.menu-item:hover{background:#19120a;color:var(--gold-hi)}.menu-item .mi{width:24px;text-align:center;color:var(--gold);font-size:19px}.modal-backdrop{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.72)}.modal-backdrop.open{display:flex}.modal{width:min(520px,100%);max-height:85dvh;overflow:auto;border:1px solid var(--gold);border-radius:var(--r-lg);background:linear-gradient(160deg,#12111a,#07070b);box-shadow:0 0 30px var(--red-glow);padding:18px}.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.modal-head h3{color:var(--gold-hi);font-size:20px}.modal-close{width:36px;height:36px;border:1px solid var(--red);border-radius:50%;color:var(--gold);font-size:20px}.modal-empty{padding:18px 8px;color:var(--muted);text-align:center}.modal-message{padding:6px 0 14px;color:var(--txt);line-height:1.5}.modal-input{width:100%;padding:12px;border:1px solid var(--gold-lo);border-radius:var(--r-sm);background:#090910;color:var(--txt);margin-bottom:12px}.modal-actions{display:flex;justify-content:flex-end;gap:8px}.modal-actions .secondary{border-color:#5a0a10;color:var(--muted)}.save-form{display:flex;gap:8px;margin-bottom:12px}.save-form input{flex:1;min-width:0;padding:11px 12px;border:1px solid var(--gold-lo);border-radius:var(--r-sm);background:#090910}.save-form button,.modal-actions button{padding:10px 14px;border:1px solid var(--gold);border-radius:var(--r-sm);color:var(--gold-text);background:#161005;font-weight:700}.saved-list{display:flex;flex-direction:column;gap:8px}.saved-row{display:flex;align-items:center;gap:8px;padding:10px;border:1px solid #30230f;border-radius:var(--r-sm);background:#0b0b11}.saved-row .saved-info{flex:1;min-width:0}.saved-row strong{display:block;color:var(--gold-text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.saved-row small{display:block;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.saved-row button{padding:8px 10px;border:1px solid var(--gold-lo);border-radius:var(--r-sm);color:var(--gold-text)}.settings-line{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid #2a2020}.settings-line span{color:var(--txt)}.settings-line small{display:block;color:var(--muted);margin-top:4px}.settings-line input{accent-color:var(--gold);width:20px;height:20px}.danger{margin-top:14px;width:100%;padding:11px;border:1px solid var(--red);border-radius:var(--r-sm);color:#ffb0b0;background:#1b080b}
@media (orientation:portrait) and (max-width:720px){.controls{flex-direction:column;align-items:stretch}.divider{display:none}.select-wrap{width:100%}.screens{grid-template-columns:1fr}.cta{padding:14px 36px;font-size:19px}}
@media (orientation:landscape) and (max-width:720px){.select-wrap{width:220px}.view{min-height:150px}.cta{padding:12px 40px;font-size:18px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<main class="app">
<div class="titlebar" aria-hidden="true"><span>♛ ⌄</span><span class="win"><span>–</span><span>☐</span><span>✕</span></span></div>
<header class="header">
<button class="icon-btn" id="menuBtn" aria-label="Menu" aria-expanded="false">☰</button>
<div class="brand"><svg viewBox="0 0 54 44" aria-hidden="true"><defs><linearGradient id="gd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe09a"/><stop offset="1" stop-color="#b8791c"/></linearGradient></defs><path d="M4 36L8 12 19 24 27 6 35 24 46 12 50 36Z" fill="url(#gd)"/><rect x="6" y="37" width="42" height="5" rx="2" fill="url(#gd)"/><circle cx="8" cy="10" r="3" fill="#ffe09a"/><circle cx="27" cy="4" r="3" fill="#ffe09a"/><circle cx="46" cy="10" r="3" fill="#ffe09a"/></svg><div class="brand-text"><b>THELORD</b><i>DELAY</i></div></div>
<button class="icon-btn" aria-label="Configurações">⚙</button>
</header>
<div class="menu-panel" id="menuPanel" aria-hidden="true"><div class="menu-title">MENU THELORD DELAY</div><button class="menu-item" data-menu="settings"><span class="mi">⚙</span><span>Configurações gerais</span></button><button class="menu-item" data-menu="layouts"><span class="mi">▣</span><span>Layouts salvos</span></button></div>
<section class="controls">
<div class="field"><label for="target">APLICAR DELAY EM:</label><div class="select-wrap"><select id="target"><option value="1">Tela 1</option><option value="2">Tela 2</option><option value="all">Ambas as telas</option></select></div></div>
<div class="divider"></div>
<div class="field delay"><label for="delay">DELAY:</label><input id="delay" type="range" min="0" max="60" step="1" value="0"><div class="range-labels"><span>0s</span><span>60s</span></div></div>
<div class="delay-actions"><output class="badge" id="badge" for="delay">0s</output><button class="save-config" id="saveConfig" aria-label="Salvar layout" title="Salvar layout">💾</button></div>
</section>
<section class="screens">
<article class="screen selected" id="screen-1">
<div class="screen-head"><span class="flame">🔥</span><h2>TELA 1</h2><span class="dup">▣</span></div>
<div class="urlbar"><span class="lock">🔒</span><input value="https://www.google.com" aria-label="Endereço da Tela 1"><button class="go">IR</button></div>
<div class="view"><div class="g-logo"><span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span></div><div class="search">🔍</div><iframe class="screen-frame" title="Navegador da Tela 1" hidden allow="fullscreen *; payment *; clipboard-read *; clipboard-write *" referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
<div class="nav"><button aria-label="Início">⌂</button><button aria-label="Voltar">‹</button><button aria-label="Avançar">›</button><button aria-label="Recarregar">↻</button><button class="nav-go" aria-label="Ir">IR</button></div></article><article class="screen" id="screen-2">
<div class="screen-head"><span class="flame">🔥</span><h2>TELA 2</h2><span class="dup">▣</span></div>
<div class="urlbar"><span class="lock">🔒</span><input value="https://www.google.com" aria-label="Endereço da Tela 2"><button class="go">IR</button></div>
<div class="view"><div class="g-logo"><span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span></div><div class="search">🔍</div><iframe class="screen-frame" title="Navegador da Tela 2" hidden allow="fullscreen *; payment *; clipboard-read *; clipboard-write *" referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
<div class="nav"><button aria-label="Início">⌂</button><button aria-label="Voltar">‹</button><button aria-label="Avançar">›</button><button aria-label="Recarregar">↻</button><button class="nav-go" aria-label="Ir">IR</button></div>
</article>
</section>
<div class="cta-wrap"><button class="cta" id="toggle" aria-pressed="false"><span>♛</span><span id="toggle-label">ATIVAR DELAY</span></button></div>

</main>
<div class="modal-backdrop" id="modalBackdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><h3 id="modalTitle"></h3><button class="modal-close" id="modalClose" aria-label="Fechar">×</button></div><div id="modalBody"></div></section></div>
<script>
const $=(s,r=document)=>r.querySelector(s);
const HOMES={1:"https://www.google.com",2:"https://www.google.com"};
function createScreen(id){
 const root=$("#screen-"+id),input=$(".urlbar input",root),frame=$(".screen-frame",root);
 const [bHome,bBack,bFwd,bReload,bLast]=root.querySelectorAll(".nav button");
 const tag=document.createElement("span");tag.className="tag";$(".screen-head h2",root).after(tag);
 const s={id,root,input,frame,delay:0,active:false,history:[HOMES[id]],index:0,
  get url(){return this.history[this.index]},
  render(){this.input.value=this.url;tag.textContent=(this.active?"● ":"")+this.delay+"s";tag.classList.toggle("on",this.active)},
  load(url){root.querySelectorAll(".view>.g-logo,.view>.search").forEach(e=>e.style.display="none");this.frame.hidden=false;this.frame.src=url},
  nav(action){const run=()=>{action();root.dispatchEvent(new CustomEvent("screen:action",{detail:{id:this.id,url:this.url,delay:this.delay,active:this.active}}))};const wait=this.active&&this.delay>0?this.delay*1000:0;if(wait)setTimeout(run,wait);else run()},
  go(u){u=(u||"").trim();if(!u)return;if(!/^https?:\/\//i.test(u))u="https://"+u;this.nav(()=>{this.history=this.history.slice(0,this.index+1).concat(u);this.index++;this.render();this.load(u)})},
  back(){if(this.index>0)this.nav(()=>{this.index--;this.render();this.load(this.url)})},
  forward(){if(this.index<this.history.length-1)this.nav(()=>{this.index++;this.render();this.load(this.url)})},
  reload(){this.nav(()=>{this.render();if(this.frame.src)this.frame.src=this.frame.src})},
  home(){this.go(HOMES[id])}
 };
 bHome.onclick=()=>s.home();bBack.onclick=()=>s.back();bFwd.onclick=()=>s.forward();bReload.onclick=()=>s.reload();
 bLast.onclick=()=>s.go(input.value);
 $(".urlbar .go",root).onclick=()=>s.go(input.value);
 input.addEventListener("keydown",e=>{if(e.key==="Enter")s.go(input.value)});
 s.render();return s;
}
const screens={1:createScreen("1"),2:createScreen("2")};window.TheLord={screens};
const range=$("#delay"),badge=$("#badge"),target=$("#target"),btn=$("#toggle");
const menuBtn=$("#menuBtn"),menuPanel=$("#menuPanel"),modalBackdrop=$("#modalBackdrop"),modalTitle=$("#modalTitle"),modalBody=$("#modalBody"),modalClose=$("#modalClose"),saveConfigBtn=$("#saveConfig");
const STORAGE={configs:"thelord_delay_configs",layouts:"thelord_delay_layouts",settings:"thelord_delay_settings"};
const targets=()=>target.value==="all"?[screens[1],screens[2]]:[screens[target.value]];
function syncRange(){const v=+range.value;range.style.setProperty("--p",v/60*100+"%");badge.textContent=v+"s"}
function onSlider(){targets().forEach(s=>{s.delay=+range.value;s.render()});syncRange()}
function syncButton(){const on=targets().every(s=>s.active);btn.classList.toggle("on",on);btn.setAttribute("aria-pressed",String(on));$("#toggle-label").textContent=on?"DESATIVAR DELAY":"ATIVAR DELAY"}
function onTarget(){range.value=targets()[0].delay;syncRange();screens[1].root.classList.toggle("selected",["1","all"].includes(target.value));screens[2].root.classList.toggle("selected",["2","all"].includes(target.value));syncButton()}
function toggle(){const next=!targets().every(s=>s.active);targets().forEach(s=>{s.active=next;s.render()});syncButton()}
function readStore(key){try{return JSON.parse(localStorage.getItem(key)||"[]")}catch(e){return[]}}
function writeStore(key,value){localStorage.setItem(key,JSON.stringify(value))}
function currentConfig(){return{delay:+range.value,target:target.value,active1:screens[1].active,active2:screens[2].active}}
function currentLayout(){return{url1:screens[1].url,url2:screens[2].url,delay:+range.value,target:target.value,active1:screens[1].active,active2:screens[2].active}}
function applyConfig(item){range.value=item.delay??0;target.value=item.target||"1";screens[1].delay=+range.value;screens[2].delay=+range.value;screens[1].active=item.active1??!!item.active;screens[2].active=item.active2??!!item.active;onTarget();screens[1].render();screens[2].render()}
function applyLayout(item){const a1=screens[1].active,a2=screens[2].active;screens[1].active=false;screens[2].active=false;screens[1].go(item.url1||HOMES[1]);screens[2].go(item.url2||HOMES[2]);screens[1].active=item.active1??!!item.active;screens[2].active=item.active2??!!item.active;screens[1].render();screens[2].render();applyConfig(item)}
function askName(label){return new Promise(resolve=>{modalTitle.textContent="Salvar "+label;modalBody.innerHTML='<div class="modal-message">Digite um nome para identificar este layout.</div><input class="modal-input" id="saveNameInput" type="text" maxlength="60" value="Meu layout" placeholder="Nome do layout"><div class="modal-actions"><button class="secondary" id="saveNameCancel">Cancelar</button><button id="saveNameOk">SALVAR</button></div>';modalBackdrop.classList.add("open");const input=$("#saveNameInput");input.focus();input.select();$("#saveNameCancel").onclick=()=>{closeModal();resolve("")};$("#saveNameOk").onclick=()=>{const name=input.value.trim();if(!name){input.focus();return}closeModal();resolve(name)};input.addEventListener("keydown",e=>{if(e.key==="Enter")$("#saveNameOk").click();if(e.key==="Escape")$("#saveNameCancel").click()})})}
async function saveConfig(){const name=await askName("configuração");if(!name)return;const list=readStore(STORAGE.configs);list.unshift({id:Date.now(),name,createdAt:new Date().toISOString(),...currentConfig()});writeStore(STORAGE.configs,list.slice(0,30));openModal("Configurações salvas")}
async function saveLayout(){const name=await askName("layout");if(!name)return;const list=readStore(STORAGE.layouts);list.unshift({id:Date.now(),name,createdAt:new Date().toISOString(),...currentLayout()});writeStore(STORAGE.layouts,list.slice(0,30));openModal("Layouts salvos")}
function openConfirmClear(){modalTitle.textContent="Confirmar exclusão";modalBody.innerHTML='<div class="modal-message">Tem certeza que deseja apagar todas as configurações e layouts salvos?</div><div class="modal-actions"><button class="secondary" id="clearCancel">Cancelar</button><button id="clearOk" style="border-color:var(--red);color:#ffb0b0">APAGAR</button></div>';modalBackdrop.classList.add("open");$("#clearCancel").onclick=closeModal;$("#clearOk").onclick=()=>{localStorage.removeItem(STORAGE.configs);localStorage.removeItem(STORAGE.layouts);openModal("settings")}}
function openModal(type){
 modalBody.innerHTML="";
 if(type==="settings"){modalTitle.textContent="Configurações gerais";modalBody.innerHTML='<div class="settings-line"><div><span>Iniciar sempre no Google</span><small>Ao abrir o aplicativo, as duas telas começam no Google.</small></div><input id="startGoogle" type="checkbox" checked></div><div class="settings-line"><div><span>Manter dados salvos neste aparelho</span><small>Permite guardar configurações e layouts no navegador.</small></div><input id="keepData" type="checkbox" checked></div><button class="danger" id="clearSaved">Apagar todas as configurações e layouts salvos</button>';$("#startGoogle").addEventListener("change",e=>localStorage.setItem(STORAGE.settings,JSON.stringify({startGoogle:e.target.checked})));$("#clearSaved").addEventListener("click",()=>{openConfirmClear()})}
 else if(type==="configs"){modalTitle.textContent="Configurações salvas";const list=readStore(STORAGE.configs);if(!list.length){modalBody.innerHTML='<div class="modal-empty">Nenhuma configuração salva ainda.</div>'}else{modalBody.innerHTML='<div class="saved-list">'+list.map(x=>'<div class="saved-row"><div class="saved-info"><strong>'+escapeHtml(x.name)+'</strong><small>Delay: '+x.delay+'s • '+(x.target==="all"?"Ambas as telas":"Tela "+x.target)+'</small></div><button data-apply-config="'+x.id+'">APLICAR</button><button data-del-config="'+x.id+'">×</button></div>').join("")+'</div>';modalBody.querySelectorAll("[data-apply-config]").forEach(b=>b.onclick=()=>{const item=list.find(x=>x.id==b.dataset.applyConfig);if(item){applyConfig(item);closeModal()}});modalBody.querySelectorAll("[data-del-config]").forEach(b=>b.onclick=()=>{writeStore(STORAGE.configs,list.filter(x=>x.id!=b.dataset.delConfig));openModal("configs")})}}
 else {modalTitle.textContent="Layouts salvos";const list=readStore(STORAGE.layouts);modalBody.innerHTML='<div class="save-form"><button id="saveLayoutNow">＋ Salvar layout atual</button></div>'+(list.length?'<div class="saved-list">'+list.map(x=>'<div class="saved-row"><div class="saved-info"><strong>'+escapeHtml(x.name)+'</strong><small>Tela 1: '+escapeHtml(x.url1)+' • Tela 2: '+escapeHtml(x.url2)+'</small></div><button data-apply-layout="'+x.id+'">APLICAR</button><button data-del-layout="'+x.id+'">×</button></div>').join("")+'</div>':'<div class="modal-empty">Nenhum layout salvo ainda.</div>');$("#saveLayoutNow").onclick=saveLayout;modalBody.querySelectorAll("[data-apply-layout]").forEach(b=>b.onclick=()=>{const item=list.find(x=>x.id==b.dataset.applyLayout);if(item){closeModal();applyLayout(item)}});modalBody.querySelectorAll("[data-del-layout]").forEach(b=>b.onclick=()=>{writeStore(STORAGE.layouts,list.filter(x=>x.id!=b.dataset.delLayout));openModal("layouts")})}
 modalBackdrop.classList.add("open");
}
function escapeHtml(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]||c))}
function closeModal(){modalBackdrop.classList.remove("open")}
function closeMenu(){menuPanel.classList.remove("open");menuBtn.setAttribute("aria-expanded","false");menuPanel.setAttribute("aria-hidden","true")}
function toggleMenu(){const open=!menuPanel.classList.contains("open");menuPanel.classList.toggle("open",open);menuBtn.setAttribute("aria-expanded",String(open));menuPanel.setAttribute("aria-hidden",String(!open))}
menuBtn.onclick=toggleMenu;modalClose.onclick=closeModal;modalBackdrop.addEventListener("click",e=>{if(e.target===modalBackdrop)closeModal()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeMenu();closeModal()}});
menuPanel.querySelector('[data-menu="settings"]').onclick=()=>{closeMenu();openModal("settings")};
menuPanel.querySelector('[data-menu="layouts"]').onclick=()=>{closeMenu();openModal("layouts")};
saveConfigBtn.onclick=saveLayout;
range.addEventListener("input",onSlider);target.addEventListener("change",onTarget);btn.addEventListener("click",toggle);onTarget();
if("serviceWorker"in navigator)navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{});
</script>
</body>
</html>
