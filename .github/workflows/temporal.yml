name: Temporal pipeline
# CI temporal principal — sem cache npm para não exigir lockfile

on:
  push:
    branches: ["main"]
    paths:
      - "js/**"
      - "tools/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/temporal.yml"
  pull_request:
    paths:
      - "js/**"
      - "tools/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/temporal.yml"

jobs:
  temporal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run test:temporal:e2e
      - run: TEMPORAL_DELAY_SELFTEST_DELAY_MS=3000 npm run test:temporal:e2e
